[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wfi2mask"
version = "0.2.0"
description = "Automated water mask detection from WFI images (CBERS-4, CBERS-4A, Amazonia-1) and Sentinel-2 using the Namikawa et al. (2016) Hue algorithm enhanced with NDWI, HAND and NIR filters."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Gabriel Lucas", email = "gabriel.lucas.oceano@gmail.com" },
]
keywords = [
    "remote-sensing", "water-detection", "CBERS", "Amazonia-1", "WFI",
    "Sentinel-2", "INPE", "water-mask", "NDWI", "HAND",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.22",
    "rasterio>=1.3",
    "geopandas>=0.12",
    "shapely>=2.0",
    "pyproj>=3.4",
    "matplotlib>=3.5",
    "tqdm>=4.60",
    "requests>=2.28",
    "cbers4asat>=0.9",
    "pystac-client>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build", "twine"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "myst-parser>=2.0"]

[project.urls]
Homepage = "https://github.com/silvaglx/wfi2mask"
Documentation = "https://wfi2mask.readthedocs.io"
Repository = "https://github.com/silvaglx/wfi2mask"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
